<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Board</title>
  </head>
  <body>
    <div class="main-container">
      <!-- creat btn container -->
      <div class="container1">
        <button class="btn btn-success c1_button">Create note</button>
        <!-- dropdown -->
        <div class="dropdown theme-dropdown">
          <button
            class="btn btn-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            🎨 Themes
          </button>

          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" href="#" data-theme="classic">Classic</a>
            </li>
            <li>
              <a class="dropdown-item" href="#" data-theme="frieren">Frieren</a>
            </li>
            <li><a class="dropdown-item" href="#" data-theme="jjk">JJK</a></li>
          </ul>
        </div>
      </div>
      <!-- creat btn container end -->
      <!-- note container start-->
      <div class="container2"></div>
      <!-- note container end-->
      <!-- creat note container start -->
      <div class="container3">
        <textarea
          class="c3_textarea"
          name=""
          id="text-note"
          placeholder="Write  Note..."
          maxlength="96"
        ></textarea>
        <img
          id="c3_check-icon"
          src="./src/assets/87db2a12-642f-4a28-86e3-06d58a8a772b-Photoroom.png"
          alt="check mark"
        />
        <img
          class="c3_x-icon"
          src="./src/assets/87db2a12-642f-4a28-86e3-06d58a8a772a-Photoroom.png"
          alt="x mark note-delete"
        />
      </div>
      <!-- creat note container end-->

      <!-- note modal start -->
      <div class="note-modal">
        <div class="note-modal-content">
          <span class="close-modal">
            <img
              src="./src/assets/87db2a12-642f-4a28-86e3-06d58a8a772a-Photoroom.png"
              alt="x mark"
          /></span>
          <div class="modal-note"></div>
        </div>
      </div>
      <!-- note modal end -->
    </div>
    <!-- javascript linking -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
