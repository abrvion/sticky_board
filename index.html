<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Board</title>
  </head>
  <body>
    <div class="main-container">
      <div class="container1">
        <button class="btn btn-success c1_button">Create a new note</button>
      </div>
      <div class="container2"></div>
      <div class="container3">
        <textarea
          class="c3_textarea"
          name=""
          id="text-note"
          placeholder="Write  Note..."
          maxlength="96"
        ></textarea>
        <img
          id="c3_check-icon"
          src="./src/assets/87db2a12-642f-4a28-86e3-06d58a8a772b-Photoroom.png"
          alt="check mark"
        />
        <img
          id="c3_x-icon"
          src="./src/assets/87db2a12-642f-4a28-86e3-06d58a8a772a-Photoroom.png"
          alt="x mark"
        />
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
